name: Deploy to Firebase

# Auto-deploy เมื่อ push เข้า main (กดรันเองได้ผ่าน workflow_dispatch)
# ทำหน้าที่แทนคำสั่ง manual เดิม:
#   pnpm build → functions build → firebase deploy (hosting, rules, functions)
#
# ── Secrets ที่ต้องตั้งใน repo (Settings → Secrets and variables → Actions) ──
#   FIREBASE_SERVICE_ACCOUNT_LIVETUBEX_ADMIN : เนื้อ JSON ของ service account (ทั้งไฟล์)
#       (สร้างโดย `firebase init hosting:github`)
#   NEXT_PUBLIC_FIREBASE_API_KEY
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#   NEXT_PUBLIC_LINE_LIFF_ID
# (NEXT_PUBLIC_* ต้องมีตอน build เพราะ static export ฝัง config ลง bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Frontend: static export → out/ ──
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_LINE_LIFF_ID: ${{ secrets.NEXT_PUBLIC_LINE_LIFF_ID }}

      # ── Functions: TypeScript → lib/ (ใช้ npm lockfile แยกของตัวเอง) ──
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      # ── Deploy ทั้ง hosting + rules + functions ด้วย service account ──
      - name: Deploy to Firebase
        run: |
          SA="$RUNNER_TEMP/service-account.json"
          # secret อาจเป็น raw JSON หรือ base64 (แล้วแต่เวอร์ชัน firebase init) — รองรับทั้งคู่
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '^[[:space:]]*{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$SA"
          fi
          node -e "const d=require('$SA'); if(!d.client_email) throw new Error('SA JSON ไม่มี client_email'); console.log('Using service account:', d.client_email);"
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          # บังคับ IPv4 ก่อน: Node 17+ เลือก IPv6 ก่อน แล้ว IPv6 ของ runner ไป
          # googleapis oauth2 endpoint ถูก reset ("Premature close") ทำให้ขอ token ไม่ได้
          # firebase รายงานหลอกเป็น "Failed to authenticate" (firebase-tools#10726)
          export NODE_OPTIONS="--dns-result-order=ipv4first"
          npx firebase-tools@13 deploy \
            --only hosting,firestore:rules,storage,functions \
            --project livetubex-admin \
            --non-interactive \
            --force
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVETUBEX_ADMIN }}
