name: Deploy to Firebase

# Auto-deploy เมื่อ push เข้า main (กดรันเองได้ผ่าน workflow_dispatch)
# ทำหน้าที่แทนคำสั่ง manual เดิม:
#   pnpm build → functions build → firebase deploy (hosting, rules, functions)
#
# ── Secrets ที่ต้องตั้งใน repo (Settings → Secrets and variables → Actions) ──
#   FIREBASE_SERVICE_ACCOUNT_LIVETUBEX_ADMIN : เนื้อ JSON ของ service account (ทั้งไฟล์)
#       (สร้างโดย `firebase init hosting:github`)
#   NEXT_PUBLIC_FIREBASE_API_KEY
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#   NEXT_PUBLIC_LINE_LIFF_ID
# (NEXT_PUBLIC_* ต้องมีตอน build เพราะ static export ฝัง config ลง bundle)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # ── Frontend: static export → out/ ──
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_LINE_LIFF_ID: ${{ secrets.NEXT_PUBLIC_LINE_LIFF_ID }}

      # ── Functions: TypeScript → lib/ (ใช้ npm lockfile แยกของตัวเอง) ──
      - name: Install functions deps
        run: npm ci
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      # ── Deploy ทั้ง hosting + rules + functions ──
      # ใช้ w9jds/firebase-action (รันใน Docker, runtime ของตัวเอง) เลี่ยง bug
      # HTTP client ของ firebase-tools บน Node ของ runner ("Premature close")
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v15.22.3
        with:
          # hosting อย่างเดียว: SA จาก firebase init มีสิทธิ์นี้อยู่แล้ว
          # functions/rules ต้องการ IAM roles เพิ่ม — deploy มือ หรือเพิ่มสิทธิ์ทีหลัง
          args: deploy --only hosting --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIVETUBEX_ADMIN }}
          PROJECT_ID: livetubex-admin
